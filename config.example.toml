# multimodem sample configuration

# Side facing client apps (Winlink Express, UI-View, etc). Speaks AGWPE.
[client_server]
host = "0.0.0.0"
port = 9000

# rigctld-compatible PTT endpoint exposed to modems / rig control scripts.
[rigctld]
host = "0.0.0.0"
port = 4532

# Hardware PTT: keys the actual radio whenever a modem or a rigctld
# client grants/releases PTT through the channel arbiter. Omit this
# section (or leave driver = "none") to run arbitration-only, with no
# radio attached.
#
# Deployment contract -- there must be exactly one thing keying the
# radio, not each backend doing its own thing independently:
#   - VARA and ARDOP modems key PTT through their own native API lines
#     (VARA's "PTT ON"/"PTT OFF", ARDOP's "PTT TRUE"/"PTT FALSE"),
#     which this multiplexer forwards to whatever's configured here.
#     For that to be the *only* thing keying the radio, disable VARA's
#     own PTT hardware method (Setup -> PTT Port -> None) and don't
#     configure ARDOP with a PTT serial/CAT device of its own -- see
#     the notes on the [[modems]] entries below.
#   - AGWPE-side engines (direwolf) have no PTT signaling in the AGWPE
#     protocol at all, so they can't go through this config -- point
#     their own PTT setting at the [rigctld] server above instead (see
#     the direwolf entry below).
[ptt_control]
driver = "none"   # "none" | "cm108" | "civ" | "rigctld"

# --- driver = "cm108": Digirig / SignaLink-style USB-audio-fob GPIO PTT.
# Nothing below is required for a stock digirig -- only set these if you
# have a nonstandard interface (check with e.g. `python -m hid` or your
# OS's USB device list):
# vendor_id = 0x0d8c
# product_id = 0x000c
# gpio_pin = 3            # which GPIO pin PTT is wired to
# active_high = true      # false if PTT keys on GPIO low instead

# --- driver = "civ": Icom CAT PTT over USB-serial (e.g. IC-705). No
# extra PTT wiring needed -- just the radio's USB CAT/CDC serial port.
# serial_port = "/dev/cu.usbserial-1410"  # omit to auto-detect a single Icom USB device
# baud = 19200             # required -- must match the radio's CI-V baud setting
# radio_address = 0xa4     # defaults to the IC-705's address if omitted

# --- driver = "rigctld": forward granted PTT requests to an externally
# managed hamlib rigctld (any rig model hamlib supports), e.g. started
# separately with `rigctld -m <model> -r /dev/ttyUSB0 -t 4533`. Use a
# different port than the [rigctld] section above -- that one is
# multimodem's own server, this is a client connecting out to a
# different rigctld instance.
# host = "127.0.0.1"
# port = 4533

# Backend modems. Only one RF transmission may be active across all of
# these at any time, since they share a single radio.

[[modems]]
name = "direwolf"
type = "agwpe"
host = "127.0.0.1"
port = 8001
# agwpe_port = 0  # direwolf channel (0 = its first, the default)
#
# direwolf has no way to report PTT over AGWPE, so point its own PTT
# setting at the [rigctld] server above instead of a GPIO/serial/CAT
# device -- in direwolf.conf:
#   PTT RIG 2 127.0.0.1:4532

# A second radio on the same direwolf instance (same TCP port, a
# different AGWPE channel) shows up as its own modem entry here.
# [[modems]]
# name = "direwolf-uhf"
# type = "agwpe"
# host = "127.0.0.1"
# port = 8001
# agwpe_port = 1

[[modems]]
name = "ardop"
type = "ardop"
host = "127.0.0.1"
port = 8515          # command port
control_port = 8516  # data port
#
# For [ptt_control] above to be the sole PTT trigger, ARDOP must be
# started with no PTT device of its own configured. Note: ARDOP's own
# docs say PTT is normally generated by the TNC itself for handshake-
# timing reasons -- routing it through us instead adds a little
# latency (TCP round trip + our own dispatch); this is a known,
# working pattern (see the community "ardopctl" rigctld bridge), not
# theoretical, but it's a real trade-off worth knowing about.

[[modems]]
name = "mercury"
type = "vara"
host = "127.0.0.1"
port = 8300           # command port
control_port = 8301   # data port
#
# For [ptt_control] above to be the sole PTT trigger, set VARA's own
# PTT Port to "None" in VARA's Setup dialog -- otherwise VARA keys its
# own hardware independently of us, and you're back to two PTT sources
# for one radio.

# [[modems]]
# name = "vara"
# type = "vara"
# host = "127.0.0.1"
# port = 8300           # command port
# control_port = 8301   # data port

# Same VARA instance, its KISS interface for unproto/APRS traffic.
# Shares the "vara" name so it shares one ChannelArbiter owner with
# the ARQ entry above -- they're one physical radio, one channel.
# [[modems]]
# name = "vara"
# type = "vara_kiss"
# host = "127.0.0.1"
# port = 8310           # VARA's KISS port
